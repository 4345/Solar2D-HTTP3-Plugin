// Kotlin из плагина убран: загрузчик переписан на Java, пакет переименован из
// plugin.http3.native в plugin.http3.ntv (native — ключевое слово Java, ради
// обхода которого Kotlin и держали). См. plugin/http3/ntv/LuaLoader.java.
apply plugin: 'com.android.library'

android {
    compileSdk 35
    defaultConfig {
        // Устанавливаем namespace для ресурсов (избегаем ключевого слова native)
        namespace "plugin.http3.native_stub"

        minSdkVersion 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

dependencies {
    implementation ':Corona@aar'
    // Зависимость от Cronet из Google Play Services (динамическая загрузка Cronet из ОС)
    implementation 'com.google.android.gms:play-services-cronet:18.0.1'
}

def buildDirectory = getLayout().getBuildDirectory().asFile.get()

// ДВА РАЗНЫХ ИМЕНИ, и путать их нельзя - именно на этом задача выкладки молча
// промахивалась мимо цели.
//   imyaModulya - имя Lua-модуля и Java-пакета загрузчика:
//                 require("plugin.http3.ntv") -> класс plugin.http3.ntv.LuaLoader.
//                 Им называется извлекаемый jar.
//   imyaPlagina - имя плагина в build.settings приложения. Именно ПО НЕМУ
//                 Solar2D ищет локальную копию:
//                 Solar2DPlugins/<издатель>/<имя плагина>/<платформа>/data.tgz
//                 (см. ReadMe.md, «Способ 2»). В каталог с именем модуля
//                 Solar2D не заглядывает вовсе.
// Объявлены ДО задач: замыкание Groovy захватывает только те переменные,
// которые объявлены выше него.
def imyaModulya = 'plugin.http3.ntv'
def imyaPlagina = 'plugin.http3'

// "ТОЛСТЫЙ" AAR БОЛЬШЕ НЕ НУЖЕН И УДАЛЁН.
// Он существовал ровно затем, чтобы протащить kotlin-stdlib внутрь classes.jar:
// Solar2D извлекает из AAR только classes.jar и не разрешает его transitive-
// зависимости, поэтому Kotlin-загрузчик падал бы с NoClassDefFoundError на
// kotlin.jvm.internal.Intrinsics. А в приложении, где Kotlin УЖЕ есть, вшитый
// stdlib ронял сборку на дубликатах классов.
// Теперь Kotlin в плагине не используется вовсе (загрузчик на Java, пакет
// plugin.http3.ntv), поэтому обе беды отпали вместе с их причиной.

tasks.register("extractPluginJar") {
    group "Solar2Dev"
    dependsOn assembleRelease
    doLast {
        copy {
            from zipTree("$buildDirectory/outputs/aar/${project.name}-release.aar").matching {
                include "classes.jar"
            }
            into "$buildDirectory/outputs/"
            // Имя пакета плагина в Solar2D
            rename "classes.jar", "${imyaModulya}.jar"
        }
    }
}

// This creates archive for plugin so it can be used by Simulator from build.settings
// by deploying it directly to Solar2DPlugins directory. This is first in line location
// to retrieve plugins, so will overshadow online directory/store downloads.
// Идентификатор издателя (publisherId)
def providerId = 'ovh.azi'

tasks.register("deployToLocalSolar2DRepo", Tar) {
    group "Solar2Dev"

    dependsOn assembleRelease

    compression = Compression.GZIP
    archiveFileName = "data.tgz"
    // Определяем корень папки плагинов симулятора
    def rootS2DP
    if (System.getenv("APPDATA")) {
        rootS2DP = System.getenv("APPDATA")
    } else {
        rootS2DP = System.getenv("USERPROFILE") ?: System.getProperty("user.home")
    }
    def dst = file("$rootS2DP/Solar2DPlugins/$providerId/$imyaPlagina/android")
    destinationDirectory = dst

    // Упаковываем обычную AAR: посторонних классов в ней нет, только сам плагин.
    into("/") {
        from("$buildDirectory/outputs/aar")
        include("${project.name}-release.aar")
    }
    // Добавляем файл corona.gradle с динамическими зависимостями в архив
    into("/") {
        from("../")
        include("corona.gradle")
    }
    doLast {
        println("\n\n\n== !!! IMPORTANT !!! ==\nMake sure to delete plugin when done: $dst\nThis plugin will override any Solar2Directory plugin, or plugin from any other source")
    }
}
